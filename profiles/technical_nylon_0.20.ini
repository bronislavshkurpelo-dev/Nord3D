# NORD 3D Slicer Profile: Technical Nylon / Carbon (0.4 nozzle, 0.20mm layer)
# Для шестерней, втулок и деталей механизмов под высокую нагрузку
printer_model = High-Temp Enclosed 3D Printer
nozzle_diameter = 0.4
layer_height = 0.20
first_layer_height = 0.24
perimeters = 5
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 45%
fill_pattern = honeycomb

# Температурные режимы
filament_type = NYLON
temperature = 265
first_layer_temperature = 270
bed_temperature = 100
first_layer_bed_temperature = 105
chamber_temperature = 50

# Скоростные режимы
max_print_speed = 90
perimeter_speed = 50
infill_speed = 70
travel_speed = 200
