# NORD 3D Slicer Profile: Arctic PETG (0.4 nozzle, 0.20mm layer)
# Оптимизировано для морозостойких деталей Норильского района
printer_model = Bambu Lab P1S / Voron 2.4
nozzle_diameter = 0.4
layer_height = 0.20
first_layer_height = 0.24
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 30%
fill_pattern = gyroid

# Температурные режимы
filament_type = PETG
temperature = 240
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 85
fan_always_on = 1
cooling = 1

# Скоростные режимы (мм/с)
max_print_speed = 150
perimeter_speed = 80
infill_speed = 120
travel_speed = 250
first_layer_speed = 30

# Ретракты
retract_length = 0.8
retract_speed = 35
